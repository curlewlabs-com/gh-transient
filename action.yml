# Expose the gh_transient package bundled with this action.
#
# The package is the code beside this file, so the job needs no checkout of
# this repository, no pip install and no network fetch of its own: the runner
# has already downloaded this action while setting up the job. That matters
# for a tool whose job is surviving GitHub's transient failures - an install
# step mid-job would be one more request that can fail transiently with
# nothing retrying it.
#
# The step itself needs no Python. With the default export a later step runs
# `python3 -m gh_transient read -- <gh arguments>`, or imports gh_transient
# from its own Python; the README has both.

name: "gh-transient"
description: >-
  Expose the bundled gh_transient package so a step can re-issue a gh read
  that GitHub failed to serve and abort on one it answered.

inputs:
  export-pythonpath:
    description: "Prepend the bundled source to PYTHONPATH for later job steps."
    default: "true"
outputs:
  source-path:
    description: "Absolute directory containing the bundled gh_transient package."
    value: ${{ steps.setup.outputs.source-path }}

runs:
  using: composite
  steps:
    - name: Expose the bundled gh_transient package
      id: setup
      shell: sh
      env:
        EXPORT_PYTHONPATH: ${{ inputs.export-pythonpath }}
      run: '"$GITHUB_ACTION_PATH/action/put-on-pythonpath.sh"'
