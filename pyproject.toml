[build-system]
requires = ["flit_core==4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "gh-transient"
version = "0.2.0"
description = "Tell a gh CLI call GitHub failed to serve from one it answered, and re-issue a read that was the first kind."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Curlew Labs" }]
# The python3 the current Ubuntu hosted runner image ships; the package's
# __init__ refuses anything older with a message.
requires-python = ">=3.12"
# Nothing: the package runs on the standard library, plus the `gh` CLI on PATH.
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
gh-transient = "gh_transient.cli:main"

[project.urls]
Repository = "https://github.com/curlewlabs-com/gh-transient"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
