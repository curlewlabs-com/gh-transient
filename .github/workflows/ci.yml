name: CI

# Every pull request and push to main runs the checks a contributor runs
# locally, plus the action as a workflow uses it. The weekly run catches what
# changes outside this repository - the runner images and the python3 and gh
# they carry - before a user's job does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: ruff format
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
      - name: mypy (strict)
        run: mypy

  test:
    # The oldest Python the package supports, and the python3 each runner
    # image ships, on Linux x86_64 and arm64 and on macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: "3.12"
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - if: matrix.python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

  action:
    # The action as a user's workflow runs it: a later step imports the package
    # and runs the command with no install, and a real read goes through it.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The action, as a workflow uses it
        uses: ./
      - name: A later step imports the package
        run: python3 -c 'import gh_transient; print(gh_transient.__file__)'
      - name: A later step reads through the command
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m gh_transient read -- api "repos/$GITHUB_REPOSITORY" --jq .full_name

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run actionlint
        # The installer script is pinned to a commit rather than its main
        # branch, and fetches the release named after it. Renovate moves the
        # release; the script's commit moves by hand, and need not match.
        run: |
          # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs: [lint, test, action, actionlint]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          ACTION: ${{ needs.action.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
        run: |
          test "$LINT" = success && test "$TEST" = success &&
            test "$ACTION" = success && test "$ACTIONLINT" = success
