name: CI

# Every pull request and push to main runs the checks a contributor runs
# locally, plus the action as a workflow uses it. The weekly run catches what
# changes outside this repository - the runner images and the python3 and gh
# they carry - before a user's job does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  test:
    # The oldest Python the package supports, and the python3 each runner
    # image ships, on Linux x86_64 and arm64 and on macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: "3.12"
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

  action:
    # The action as a user's workflow runs it: a later step imports the package
    # and runs the command with no install, and a real read goes through it.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The action, as a workflow uses it
        uses: ./
      - name: A later step imports the package
        run: python3 -c 'import gh_transient; print(gh_transient.__file__)'
      - name: A later step reads through the command
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m gh_transient read -- api "repos/$GITHUB_REPOSITORY" --jq .full_name
      # GITHUB_ENV is read a line at a time, so a PYTHONPATH holding a newline
      # would set a second variable of its own; the action must refuse it.
      - name: The action refuses a PYTHONPATH holding a newline
        id: newline
        continue-on-error: true
        env:
          PYTHONPATH: "/somewhere\nINJECTED=1"
        uses: ./
      - name: Require that it refused, and set nothing
        env:
          OUTCOME: ${{ steps.newline.outcome }}
        run: test "$OUTCOME" = failure && test -z "${INJECTED:-}"

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@f05f17a38ba2dfbaf0cde130a375b346e9a923a2 # v0.2.0

  typescript:
    # The TypeScript entry point, and the tarball a release attaches. Its tests
    # run the Python package through the command, so they run on the runner's
    # own python3, as a caller's would.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # The tarball and the Python package are one release, so their versions
      # cannot differ.
      - name: Check package.json and pyproject.toml name one version
        run: |
          npm_version=$(bun -e 'console.log(require("./package.json").version)')
          python_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$npm_version" = "$python_version"
      # The release asset is this tarball, so its file list is checked on every
      # change: the TypeScript entry point, the Python it runs, and no test.
      - name: Pack the release tarball
        run: bun pm pack --destination "$RUNNER_TEMP"
      - name: Check the tarball's contents
        run: |
          tar -tzf "$RUNNER_TEMP"/curlewlabs-com-gh-transient-*.tgz | sort > "$RUNNER_TEMP/packed.txt"
          cat "$RUNNER_TEMP/packed.txt"
          grep -qx 'package/ts/index.ts' "$RUNNER_TEMP/packed.txt"
          grep -qx 'package/src/gh_transient/cli.py' "$RUNNER_TEMP/packed.txt"
          grep -qx 'package/src/gh_transient/retry.py' "$RUNNER_TEMP/packed.txt"
          grep -qx 'package/src/gh_transient/classify.py' "$RUNNER_TEMP/packed.txt"
          grep -qx 'package/LICENSE-MIT' "$RUNNER_TEMP/packed.txt"
          if grep -E '\.test\.ts$|/tests/' "$RUNNER_TEMP/packed.txt"; then
            echo "test files in the tarball" >&2
            exit 1
          fi
      # A caller runs the tarball, not this tree: installed into a project of
      # its own (consumer/), type-checked there by the caller's compiler, and
      # run from a directory of its own.
      - name: Install the tarball into a caller's project
        run: |
          cp -R consumer "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          bun add "$RUNNER_TEMP"/curlewlabs-com-gh-transient-*.tgz
      # Each TypeScript release the package's callers compile with, so a form
      # one of them rejects fails here rather than in a caller's typecheck:
      # the 7 this repository pins, and the 6 its other callers are on. That
      # one is this job's input, not the package's: fetched by exact version
      # and checked against the integrity npm publishes for it (`npm view
      # typescript@<version> dist.integrity`), so a version moved without its
      # integrity fails here. It has no dependencies, so the tarball is the
      # whole compiler.
      - name: Type-check the caller under each TypeScript its callers use
        env:
          # renovate: datasource=npm depName=typescript
          TYPESCRIPT_6_VERSION: 6.0.3
          TYPESCRIPT_6_INTEGRITY: sha512-y2TvuxSZPDyQakkFRPZHKFm+KKVqIisdg9/CZwm9ftvKXLP8NRWj38/ODjNbr43SsoXqNuAisEf1GdCxqWcdBw==
        run: |
          ts6="$RUNNER_TEMP/typescript-6"
          mkdir "$ts6"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$ts6/typescript.tgz" \
            "https://registry.npmjs.org/typescript/-/typescript-$TYPESCRIPT_6_VERSION.tgz"
          test "sha512-$(openssl dgst -sha512 -binary "$ts6/typescript.tgz" | openssl base64 -A)" = "$TYPESCRIPT_6_INTEGRITY"
          tar -xzf "$ts6/typescript.tgz" -C "$ts6"
          for tsc in node_modules/typescript/bin/tsc "$ts6/package/bin/tsc"; do
            "$tsc" --version
            "$tsc" -p "$RUNNER_TEMP/consumer" --typeRoots "$PWD/node_modules/@types"
          done
      # One real read through the installed copy, from a directory holding a
      # stand-in for a standard module the command imports, with PYTHONPATH
      # naming it; were the stand-in imported, the read would print nothing.
      - name: Read through the installed tarball, as a caller does
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/consumer"
          printf 'raise SystemExit(0)\n' > argparse.py
          read=$(PYTHONPATH=. bun read.ts)
          test "$read" = "$GITHUB_REPOSITORY"

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs: [lint, test, typescript, action, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          TYPESCRIPT: ${{ needs.typescript.result }}
          ACTION: ${{ needs.action.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: |
          test "$LINT" = success && test "$TEST" = success &&
            test "$TYPESCRIPT" = success && test "$ACTION" = success &&
            test "$BASELINE" = success
